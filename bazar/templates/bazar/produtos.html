{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <title>Produtos - Bazar My Love</title>
</head>
<body>
    <h1>Lista de Produtos</h1>
    <ul>
      {% for produto in produtos %}
        <li>{{ produto.nome }} - R$ {{ produto.preco }}</li>
      {% empty %}
        <li>Nenhum produto disponível no momento.</li>
      {% endfor %}
    </ul>
</body>
</html>
