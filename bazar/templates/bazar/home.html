{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <title>Bazar My Love - Pagamento PIX</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Fonte e Bootstrap -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5;
        }

        .card {
            border-radius: 15px;
        }

        .card-img-top {
            height: 250px;
            object-fit: cover;
        }

        .price {
            color: #28a745;
            font-weight: 600;
            font-size: 1.2rem;
        }

        .qr-code {
            max-width: 200px;
            margin-top: 10px;
        }

        .pix-info {
            background-color: #e0ffe0;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container py-4">
    <h1 class="text-center mb-4">🛍️ Bazar My Love</h1>

    <div class="row">
      {% for produto in produtos %}
        <div class="col-md-4 mb-4">
          <div class="card shadow-sm">
            {% if produto.imagem %}
              <img src="{{ produto.imagem.url }}" class="card-img-top" alt="{{ produto.nome }}">
            {% else %}
              <img src="{% static 'images/sem-imagem.png' %}" class="card-img-top" alt="Sem imagem">
            {% endif %}
            <div class="card-body">
              <h5 class="card-title">{{ produto.nome }}</h5>
              <p class="price">R$ {{ produto.preco }}</p>
            </div>
          </div>
        </div>
      {% empty %}
        <p class="text-center">Nenhum produto disponível no momento.</p>
      {% endfor %}
    </div>

</div> <!-- container -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
