<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title>Imagem de produto não disponível</title>
  <desc>Ilustração simples de produto para indicar imagem não disponível.</desc>
  <rect width="600" height="400" fill="#f5f5f5"/>
  <rect x="90" y="90" width="420" height="220" rx="20" fill="#ffffff" stroke="#dcdcdc" stroke-width="4"/>
  <circle cx="220" cy="200" r="50" fill="#efefef"/>
  <rect x="300" y="160" width="120" height="100" rx="10" fill="#efefef"/>
  <path d="M 180 250 L 330 140" stroke="#d0d0d0" stroke-width="12" stroke-linecap="round"/>
  <path d="M 180 150 L 330 260" stroke="#d0d0d0" stroke-width="12" stroke-linecap="round"/>
  <text x="300" y="360" font-family="Poppins, Arial, sans-serif" font-size="28" fill="#7a7a7a" text-anchor="middle">Imagem não disponível</text>
</svg>
